plugins {
    id 'idea'
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.91'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

// Optional local fork used only by development runs. Flat-dir module notation keeps the jar on
// ModDevGradle's remapping path; raw file dependencies cannot be mirrored as dependency constraints.
def gtceuRuntimeJar = providers.gradleProperty('gtceuRuntimeJar').orNull
def gtceuRuntimeFile = gtceuRuntimeJar ? file(gtceuRuntimeJar) : null
def gtceuRuntimeBaseName = gtceuRuntimeFile?.name?.replaceFirst(/\.jar$/, '')
def gtceuRuntimeVersionSeparator = gtceuRuntimeBaseName?.lastIndexOf('-') ?: -1
if (gtceuRuntimeFile != null
        && (!gtceuRuntimeFile.isFile() || gtceuRuntimeVersionSeparator <= 0)) {
    throw new GradleException('gtceuRuntimeJar must point to an existing versioned jar')
}
def gtceuRuntimeArtifact = gtceuRuntimeFile == null
        ? null
        : gtceuRuntimeBaseName.substring(0, gtceuRuntimeVersionSeparator)
def gtceuRuntimeVersion = gtceuRuntimeFile == null
        ? null
        : gtceuRuntimeBaseName.substring(gtceuRuntimeVersionSeparator + 1)
def developmentRunDirectory = gtceuRuntimeFile == null ? file('run') : file('run-gtceu-fork')
def recipeViewerRuntime = providers.gradleProperty('recipeViewerRuntime').getOrElse('jei').toLowerCase(Locale.ROOT)
if (!(recipeViewerRuntime in ['jei', 'emi', 'none'])) {
    throw new GradleException('recipeViewerRuntime must be one of: jei, emi, none')
}

repositories {
    mavenLocal()
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Jared's Maven"
                url = "https://maven.blamejared.com"
            }
        }
        filter {
            includeGroup "mezz.jei"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "TerraformersMC"
                url = "https://maven.terraformersmc.com/releases"
            }
        }
        filter {
            includeGroup "dev.emi"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Create Maven"
                url = "https://maven.createmod.net"
            }
        }
        filter {
            includeGroup "com.simibubi.create"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "GTCEu Maven"
                url = "https://maven.gtceu.com"
            }
        }
        filter {
            includeGroup "com.gregtechceu.gtceu"
        }
    }
    if (gtceuRuntimeFile != null) {
        flatDir {
            name = "Local GTCEu fork"
            dirs gtceuRuntimeFile.parentFile
        }
    }
}

base {
    archivesName = mod_id
}

tasks.named('jar', Jar).configure {
    from('LICENSE.md', 'README.md', 'CHANGELOG.md')
    exclude 'com/warmthdawn/appliedpackaging/gametest/**'
    manifest {
        attributes([
                'Specification-Title'     : mod_name,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : mod_version,
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : "${mod_id}.mixins.json"
        ])
    }
}

// Mojang ships Java 17 to end users in 1.20.1, so mods should target Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

legacyForge {
    // Specify the version of MinecraftForge to use.
    version = project.minecraft_version + '-' + project.forge_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // Expose AE2's live IconButton presentation state to the shared current-AE2 renderer.
    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Keep GameTests from executing in ordinary clients. Forge still discovers annotated
            // holders reflectively, so optional integration signatures live in an unannotated helper.
            systemProperty 'forge.enabledGameTestNamespaces', 'appliedpackaging_client_disabled'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            gameDirectory = developmentRunDirectory

            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Sets up a dependency configuration called 'localRuntime' and a deobfuscating one called 'modLocalRuntime'
// These configurations should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}
obfuscation {
    createRemappingConfiguration(configurations.localRuntime)
}

dependencies {
    // If you wish to declare dependencies against mods, make sure to use the 'mod*' configurations so that they're remapped.
	// See https://github.com/neoforged/ModDevGradle/blob/main/LEGACY.md#remapping-mod-dependencies for more information.
	
    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // modImplementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // modImplementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // modImplementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
    modImplementation "maven.modrinth:${ae2_modrinth_project}:${ae2_modrinth_version}"
    modImplementation "org.appliedenergistics:guideme:${guideme_version}"

    // One JEI plugin implementation serves both viewers. TMRV maps that plugin to EMI without JEI.
    // Complete viewer mods are development-only and are not published as transitive dependencies.
    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}"
    if (recipeViewerRuntime == 'jei') {
        modLocalRuntime "mezz.jei:jei-${minecraft_version}-forge:${jei_version}"
    }
    if (recipeViewerRuntime == 'emi') {
        modLocalRuntime "dev.emi:emi-forge:${emi_version}"
        modLocalRuntime "maven.modrinth:tmrv:${tmrv_version}"
    }
    modCompileOnly "com.simibubi.create:create-${minecraft_version}:${create_version}:slim"
    // The Maven slim jar is suitable for compilation; the all jar carries Create's bundled runtime libraries.
    modLocalRuntime "com.simibubi.create:create-${minecraft_version}:${create_version}:all"
    modCompileOnly "com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}"
    if (gtceuRuntimeFile != null) {
        modLocalRuntime "local.gtceu:${gtceuRuntimeArtifact}:${gtceuRuntimeVersion}"
    } else {
        modLocalRuntime "com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}"
    }
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version        : minecraft_version,
            minecraft_version_range  : minecraft_version_range,
            forge_version            : forge_version,
            forge_version_range      : forge_version_range,
            loader_version_range     : loader_version_range,
            mod_id                   : mod_id,
            mod_name                 : mod_name,
            mod_license              : mod_license,
            mod_version              : mod_version,
            mod_authors              : mod_authors,
            mod_description          : mod_description,
            ae2_version              : ae2_version,
            ae2_version_range        : ae2_version_range,
            guideme_version_range    : guideme_version_range
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
legacyForge.ideSyncTask generateModMetadata

var copyGameTestStructures = tasks.register("copyGameTestStructures", Copy) {
    from "gameteststructures"
    into new File(developmentRunDirectory, "gameteststructures")
}
tasks.named("prepareGameTestServerRun").configure {
    dependsOn copyGameTestStructures
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
