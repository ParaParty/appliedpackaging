name: Build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify Gradle wrapper permissions
        shell: bash
        run: test -x ./gradlew

      - name: Setup JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3 # v6
        with:
          cache-provider: basic

      - name: Generate data
        run: ./gradlew runData --stacktrace --no-daemon --console=plain

      - name: Verify generated resources are current
        shell: bash
        run: |
          if [[ -n "$(git status --short -- src/generated/resources)" ]]; then
            echo "::error::runData changed generated resources. Commit the generated output."
            git status --short -- src/generated/resources
            git diff -- src/generated/resources
            exit 1
          fi

      - name: Run GameTests
        run: ./gradlew runGameTestServer --stacktrace --no-daemon --console=plain

      - name: Build with Gradle
        run: ./gradlew build --stacktrace --no-daemon --console=plain

      - name: Verify documentation
        shell: pwsh
        run: ./scripts/verify-docs.ps1

      - name: Verify assets
        shell: pwsh
        run: ./scripts/verify-assets.ps1

      - name: Verify release artifact
        shell: pwsh
        run: ./scripts/verify-release.ps1

      - name: Check whitespace errors
        run: git diff --check

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: appliedpackaging-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-diagnostics-${{ github.sha }}
          path: |
            build/reports/
            run/crash-reports/
            run/logs/
          if-no-files-found: ignore
          retention-days: 7
