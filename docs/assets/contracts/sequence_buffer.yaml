asset_id: sequence_buffer
asset_kind: block
generation_mode: user_authored_sheet_split
target_game: minecraft_java
target_texture_resolution: 16
visual_output_protocol: VOP-2x2-Minecraft-Asset-v1
visual_output_protocol_scope: schema_compatibility_only
visual_output_note: The VOP four-panel generation layout is not used; source_sheet 4x4 grid and split script are authoritative.
target_volume: [16, 16, 16]
panel_order:
  top_left: front
  top_right: right_side
  bottom_left: top
  bottom_right: isometric
style:
  name: user_authored_sequence_buffer
  palette_reference: E:/resources/textures/appliedpackaging/ret/sequance_buffer_all.png
asset_brief:
  summary: Pixel-preserve the user-authored 4x4 Sequence Buffer face sheet and map all controller, middle, edge, tail, directed, and undirected faces.
  source_brief: docs/04-asset-spec.md
source_sheet:
  path: E:/resources/textures/appliedpackaging/ret/sequance_buffer_all.png
  sha256: 66A26C07983D8E3CD1866B0D4EE723F2A68B1C257FCD936BCC0C3C57EECF7B8F
  size: [64, 64]
  mode: RGBA
  grid: [4, 4]
  tile_size: [16, 16]
  row_order:
    - undirected
    - directed_front
    - directed_side
    - directed_back
  column_order:
    - unformed
    - formed_middle_side
    - formed_edge_side
    - special
materials:
  - user_authored_quartz_frame
  - user_authored_green_panel
  - user_authored_fluix_indicator
required_visual_parts:
  - all 16 source cells exported without scaling or palette conversion
  - controller back and side faces
  - formed middle and edge side faces
  - occluded link face
  - tail back face
  - directed front, side, and back variants
orientation_requirements:
  structure_axes: [x, y, z]
  block_facings: [down, up, north, south, west, east]
  generated_model_count: 57
  multipart_entry_count: 58
  directed_side_arrow: texture +U points toward the block facing/front
  formed_middle_length: texture +V follows the positive structure axis
  formed_edge_length: texture +V points inward toward the controller
  preserve_block_facing_when_formed: true
  item_display_parent: minecraft:block/block
forbidden_visual_parts:
  - generated replacement pixels
  - resampling
  - palette quantization
  - lossy conversion
conversion_requirements:
  max_major_components: 16
  cuboid_friendly: true
  front_is_north: true
  keep_inside_block_volume: true
  pixel_preserve_source: true
harness_assumptions:
  output_namespace: appliedpackaging
  block_id: sequence_buffer
  texture_dir: src/main/resources/assets/appliedpackaging/textures/block/sequence_buffer/faces
  block_model_dir: src/main/resources/assets/appliedpackaging/models/block/sequence_buffer
  item_model_dir: src/main/resources/assets/appliedpackaging/models/item
  blockstate_dir: src/main/resources/assets/appliedpackaging/blockstates
  report_path: docs/assets/reports/sequence-buffer.md
  split_script: scripts/split-sequence-buffer-textures.py
  model_generator: scripts/generate-sequence-buffer-models.py
gui_assets:
  main:
    source: E:/resources/textures/appliedpackaging/ret/seq_buffer_ui.png
    runtime_path: src/main/resources/assets/appliedpackaging/textures/gui/sequence_buffer.png
    sha256: 075E3329882A3AAE7FE7EBDAAB32EBF799531DC4224F3F37B563CD6B537A2C67
    size: [256, 256]
    mode: ARGB32
    visible_rect: [0, 0, 195, 170]
    dynamic_grid:
      columns: 9
      visible_rows: 3
      first_slot: [8, 19]
      slot_background_origin: [7, 18]
      slot_step: 18
      disabled_alpha: 0.2
      scrollbar: [175, 18, 12, 54]
  side:
    source: build/reference/ae2-neoforge-v19.2.17/src/main/resources/assets/ae2/textures/guis/me_chest.png
    runtime_path: src/main/resources/assets/appliedpackaging/textures/gui/sequence_buffer_side.png
    sha256: 2749D7BDAB5E3B9BFF240B6F618AB55AE14A3C2252D9DEB63D959874456D91A0
    size: [256, 256]
    mode: ARGB32
    visible_rect: [0, 0, 176, 168]
    storage_slot: [80, 37]
  screen_styles:
    - src/main/resources/assets/ae2/screens/appliedpackaging/sequence_buffer_main.json
    - src/main/resources/assets/ae2/screens/appliedpackaging/sequence_buffer_side.json
  deferred_input_filter_panel: hidden
  settings_toolbar:
    placement: ae2_current_vertical_button_bar
    controls: [automatic_output, blocking_mode, synchronized_output, pattern_mode, input_delay]
  shared_right_panels:
    upgrade_anchor: {right: 2, top: 0}
  scrollbar_states:
