asset_id: terminal_and_buses
asset_kind: block
generation_mode: multi_asset_concept_to_model
target_game: minecraft_java
target_texture_resolution: 32
visual_output_protocol: VOP-2x2-Minecraft-Asset-v1
style:
  name: ae2_fluix_packaging
  palette_reference: docs/assets/palette.md
asset_brief:
  summary: Package-only AE2 storage and unpacking bus parts with a shared seven-row GUI.
  source_brief: docs/assets/asset-briefs/terminal-and-buses.md
materials:
  - quartz_panel
  - dark_metal
  - fluix_core
  - shadow_slot
required_visual_parts:
  - package_storage_bus temporary AE2 storage bus part silhouette
  - package_unpacking_bus temporary AE2 ME P2P tunnel part silhouette
  - separate byte-preserved 256x256 package bus GUI and user sprite textures
  - user-authored marker empty-slot icon at sprite rectangle 32,16,16,16 shared by buses, machines, and package-pattern mode
  - unmodified current-main AE2 states, extra panels, and vertical button background textures with LGPL provenance
forbidden_visual_parts:
  - text labels
  - arrows with text
  - cardboard box
  - full machine body for bus parts
  - brass gears
conversion_requirements:
  cuboid_friendly: true
  small_part_readability: true
  keep_bus_family_distinct: true
harness_assumptions:
  output_namespace: appliedpackaging
  texture_dir: src/main/resources/assets/appliedpackaging/textures/gui
  block_model_dir: src/main/resources/assets/appliedpackaging/models/part
  item_model_dir: src/main/resources/assets/appliedpackaging/models/item
  report_path: docs/assets/reports/terminal-and-buses.md
