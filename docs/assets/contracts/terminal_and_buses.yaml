asset_id: terminal_and_buses
asset_kind: block
generation_mode: multi_asset_concept_to_model
target_game: minecraft_java
target_texture_resolution: 32
visual_output_protocol: VOP-2x2-Minecraft-Asset-v1
style:
  name: ae2_fluix_packaging
  palette_reference: docs/assets/palette.md
asset_brief:
  summary: Combined advanced and package Pattern Encoding Terminal plus AE2 storage and unpacking bus parts with their current GUIs.
  source_brief: docs/assets/asset-briefs/terminal-and-buses.md
materials:
  - quartz_panel
  - dark_metal
  - fluix_core
  - shadow_slot
required_visual_parts:
  - advanced_pattern_encoding_terminal AE2 neoforge/v19.2.17 six-element item display geometry shared by item and translated placed Part, four-layer tint rendering, and user dark medium bright masks
  - package_storage_bus AE2 neoforge/v19.2.17 storage bus geometry and materials with user front
  - package_unpacking_bus AE2 neoforge/v19.2.17 panel pattern provider geometry with user front and back
  - separate byte-preserved 256x256 package bus GUI and user sprite textures
  - user-authored marker empty-slot icon at sprite rectangle 32,16,16,16 shared by buses, machines, and package-pattern mode
  - unmodified current-main AE2 states, extra panels, and vertical button background textures with LGPL provenance
  - one Advanced Pattern Terminal ScreenStyle entry with complete 217x250 advanced and 195x233 package profiles at two network rows, a 195px advanced body plus 22px mode-tab region, a 146px advanced editor, and an unscaled 124x66 package editor
  - two right-side mode tabs rendered like current-AE Pattern Encoding Terminal TabButton.Style.HORIZONTAL with 22x22 normal/selected/focus states, 21px step, and ItemStack offset (3,3)
  - inherited view-cell panel moved out of the visible area because the combined terminal creates no VIEW_CELL slots
forbidden_visual_parts:
  - text labels
  - arrows with text
  - cardboard box
  - full machine body for bus parts
  - brass gears
  - copied native pattern mode atlas
  - override of AE2 screens/terminals/pattern_encoding_terminal.json
  - package tab, delegate screen, or visual override added to the ordinary AE2 Pattern Encoding Terminal
  - display-component or VIEW_CELL panel on the combined Advanced Pattern Terminal
  - stretching the 124px package editor to the 146px advanced editor width
conversion_requirements:
  upstream_tag: neoforge/v19.2.17
  upstream_commit: 79ee2c704ad62941a426c26b1cb1f76ef5b2ee5a
  storage_bus_model: src/main/resources/assets/ae2/models/part/storage_bus_base.json
  unpacking_bus_model: src/main/resources/assets/ae2/models/part/pattern_provider_base.json
  advanced_terminal_world_base_model: src/main/resources/assets/ae2/models/item/display_base.json translated by -7 on Z
  advanced_terminal_lit_model: src/main/resources/assets/ae2/models/part/pattern_encoding_terminal_on.json
  advanced_terminal_item_model: src/main/resources/assets/ae2/models/item/display_base.json
  advanced_terminal_dark_source: E:/resources/textures/appliedpackaging/ret/adv_pattern_encoding_terminal_dark.png
  advanced_terminal_medium_source: E:/resources/textures/appliedpackaging/ret/adv_pattern_encoding_terminal_medium.png
  advanced_terminal_bright_source: E:/resources/textures/appliedpackaging/ret/adv_pattern_encoding_terminal_bright.png
  storage_front_source: E:/resources/textures/appliedpackaging/ret/pacakge_storage_bus.png
  unpacking_front_source: E:/resources/textures/appliedpackaging/ret/unpacking_panel.png
  unpacking_back_source: E:/resources/textures/appliedpackaging/ret/unpacking_panel_back.png
  preserve_lgpl_notice: true
  cuboid_friendly: true
  small_part_readability: true
  keep_bus_family_distinct: true
harness_assumptions:
  output_namespace: appliedpackaging
  texture_dir: src/main/resources/assets/appliedpackaging/textures/gui
  block_model_dir: src/main/resources/assets/appliedpackaging/models/part
  item_model_dir: src/main/resources/assets/appliedpackaging/models/item
  report_path: docs/assets/reports/terminal-and-buses.md
