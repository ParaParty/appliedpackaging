asset_id: appliedpackaging_package_items
asset_kind: item
generation_mode: variant_family
target_game: minecraft_java
target_texture_resolution: 32
style:
  name: ae2_fluix_packaging
  palette_reference: docs/assets/palette.md
asset_brief:
  summary: 3D package box item/entity models for 17 color packages, plus package pattern item icons.
  source_brief: docs/assets/asset-briefs/packages.md
materials:
  - quartz_panel
  - dark_metal
  - fluix_core
  - color_band
required_visual_parts:
  - centered sealed package silhouette
  - light quartz body
  - dark metal corner clamps
  - fluix diamond seal
  - one clear color band per variant
forbidden_visual_parts:
  - cardboard box
  - text labels
  - numbers
  - arrows
  - watermark
  - brass gears
conversion_requirements:
  centered_object: true
  transparent_background: true
  keep_readable_at_16x16: true
  package_items_use_3d_model: true
  package_face_sizes:
    front: [10, 8]
    back: [10, 8]
    side: [10, 8]
    top: [10, 10]
    bottom: [10, 10]
  package_face_uv: [0, 0, 16, 16]
  package_marker_overlay:
    source: item_marker
    face: front
    frame_size: [4, 4]
    frame_inset_from_outer_edge: 1
    rendered_size: [3, 3]
    margin: 0.5
  variants:
    - fluix_package
    - white_package
    - orange_package
    - magenta_package
    - light_blue_package
    - yellow_package
    - lime_package
    - pink_package
    - gray_package
    - light_gray_package
    - cyan_package
    - purple_package
    - blue_package
    - brown_package
    - green_package
    - red_package
    - black_package
    - package_pattern
    - packaged_processing_pattern
harness_assumptions:
  output_namespace: appliedpackaging
  texture_dir: src/main/resources/assets/appliedpackaging/textures/item
  package_box_texture_dir: src/main/resources/assets/appliedpackaging/textures/block/package_box
  package_box_model_dir: src/main/resources/assets/appliedpackaging/models/item/package_box
  model_dir: src/main/resources/assets/appliedpackaging/models/item
  report_path: docs/assets/reports/packages.md
